# @package _global_

pipeline:
  params:
    meta:
      distributions:
        train.compile.optimizer.learning_rate:
          _target_: optuna.distributions.FloatDistribution
          low: ${hpo.params.train.compile.optimizer.learning_rate.kwargs.low}
          high: ${hpo.params.train.compile.optimizer.learning_rate.kwargs.high}
          log: ${hpo.params.train.compile.optimizer.learning_rate.kwargs.log}
        train.fit.batch_size:
          _target_: optuna.distributions.CategoricalDistribution
          choices: ${hpo.params.train.fit.batch_size.kwargs.choices}

hpo:
  params:
    train.compile.optimizer.learning_rate:
      suggest_method: suggest_float
      kwargs:
        name: lr
        low: 0.00001
        high: 0.001
        log: true
    train.fit.batch_size:
      suggest_method: suggest_categorical
      kwargs:
        name: batch_size
        choices:
        - 512
        - 1024
        - 2048