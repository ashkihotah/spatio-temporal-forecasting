defaults:
  - _self_
  - cell@all_experts.GAP-LSTM: GAP-LSTM
  - cell@all_experts.MGAP-LSTM: MGAP-LSTM
  - cell@all_experts.GRU: GRU
  - cell@all_experts.LSTM: LSTM

default_cell: LSTM
# experts:
#   - ${..default_cell}
#   - ${..default_cell}
routing_cfg:
  top_k: 3
  aux_loss_weight: 0.1
  z_loss_weight: 0.1
  router_feature_indices: null
  return_routing_weights: true
result: ${get_cmoe_cfg:${.experts},${.all_experts},${.routing_cfg}}

file_deps: ${.result.file_deps}
cfg: ${.result.cfg}
name: ${.result.name}