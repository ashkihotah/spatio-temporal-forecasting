file_deps: ${concat_lists:"\${src}/kerass/layers/sequences/cells/spatio_temporal/GAPLSTMCell.py","\${src}/kerass/layers/sequences/cells/spatio_temporal/GAPLSTMWithMemoryCell.py",${.gnns_file_deps}}

cfg:
  _target_: experiments.kerass.layers.sequences.cells.spatio_temporal.GAPLSTMWithMemoryCell
  states_dim: ${dataset.n_features}
  output_dim: 1
  gcnlstm_cell_config:
    fx_gnn_config: ${model.gnns[${...selected_fx_gnn_key}].cfg}
    fh_gnn_config: ${model.gnns[${...selected_fh_gnn_key}].cfg}
    ix_gnn_config: ${model.gnns[${...selected_ix_gnn_key}].cfg}
    ih_gnn_config: ${model.gnns[${...selected_ih_gnn_key}].cfg}
    cx_gnn_config: ${model.gnns[${...selected_cx_gnn_key}].cfg}
    ch_gnn_config: ${model.gnns[${...selected_ch_gnn_key}].cfg}
    ox_gnn_config: ${model.gnns[${...selected_ox_gnn_key}].cfg}
    oh_gnn_config: ${model.gnns[${...selected_oh_gnn_key}].cfg}
  i_gnn_config: ${model.gnns[${..selected_i_gnn_key}].cfg}
  g_gnn_config: ${model.gnns[${..selected_g_gnn_key}].cfg}
  o_gnn_config: ${model.gnns[${..selected_o_gnn_key}].cfg}
  im_gnn_config: ${model.gnns[${..selected_im_gnn_key}].cfg}
  gm_gnn_config: ${model.gnns[${..selected_gm_gnn_key}].cfg}
  om_gnn_config: ${model.gnns[${..selected_om_gnn_key}].cfg}
  return_hidden_state: true

name: GMoE-M${.default_gnn}-LSTM