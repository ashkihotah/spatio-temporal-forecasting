default_gnn: GCSKIPCONN

selected_fx_gnn: ${.default_gnn}
selected_fh_gnn: ${.default_gnn}
selected_ix_gnn: ${.default_gnn}
selected_ih_gnn: ${.default_gnn}
selected_cx_gnn: ${.default_gnn}
selected_ch_gnn: ${.default_gnn}
selected_ox_gnn: ${.default_gnn}
selected_oh_gnn: ${.default_gnn}

selected_fx_gnn_key: MoE-${.selected_fx_gnn}
selected_fh_gnn_key: MoE-${.selected_fh_gnn}
selected_ix_gnn_key: MoE-${.selected_ix_gnn}
selected_ih_gnn_key: MoE-${.selected_ih_gnn}
selected_cx_gnn_key: MoE-${.selected_cx_gnn}
selected_ch_gnn_key: MoE-${.selected_ch_gnn}
selected_ox_gnn_key: MoE-${.selected_ox_gnn}
selected_oh_gnn_key: MoE-${.selected_oh_gnn}

gnns_file_deps: ${concat_lists:${model.gnns.${.selected_fx_gnn}.file_deps},${model.gnns.${.selected_fh_gnn}.file_deps},${model.gnns.${.selected_ix_gnn}.file_deps},${model.gnns.${.selected_ih_gnn}.file_deps},${model.gnns.${.selected_cx_gnn}.file_deps},${model.gnns.${.selected_ch_gnn}.file_deps},${model.gnns.${.selected_ox_gnn}.file_deps},${model.gnns.${.selected_oh_gnn}.file_deps}}

file_deps: ${concat_lists:"\${src}/kerass/layers/sequences/cells/spatio_temporal/GAPLSTMCell.py",${.gnns_file_deps}}

cfg:
  _target_: experiments.kerass.layers.sequences.cells.spatio_temporal.GAPLSTMCell
  states_dim: ${dataset.n_features}
  output_dim: 1
  fx_gnn_config: ${model.gnns[${..selected_fx_gnn_key}].cfg}
  fh_gnn_config: ${model.gnns[${..selected_fh_gnn_key}].cfg}
  ix_gnn_config: ${model.gnns[${..selected_ix_gnn_key}].cfg}
  ih_gnn_config: ${model.gnns[${..selected_ih_gnn_key}].cfg}
  cx_gnn_config: ${model.gnns[${..selected_cx_gnn_key}].cfg}
  ch_gnn_config: ${model.gnns[${..selected_ch_gnn_key}].cfg}
  ox_gnn_config: ${model.gnns[${..selected_ox_gnn_key}].cfg}
  oh_gnn_config: ${model.gnns[${..selected_oh_gnn_key}].cfg}
  return_hidden_state: true

name: GMoE-${.default_gnn}-LSTM