# @package _global_

plots:
  enc_morans:
    id: enc_morans_plot
    cfg:
      _target_: experiments.plotlyy.get_morans_plot
      deps:
        hidden_states: ${pipeline.params.paths.enc_hidden_states_dump_path}
        adj_path: ${pipeline.params.paths.adj_path}
      name: "Encoder Morans I over Timesteps"
    
  dec_morans:
    id: dec_morans_plot
    cfg:
      _target_: experiments.plotlyy.get_morans_plot
      deps:
        hidden_states: ${pipeline.params.paths.dec_hidden_states_dump_path}
        adj_path: ${pipeline.params.paths.adj_path}
      name: "Decoder Morans I over Timesteps"

  enc_tsne:
    id: enc_tsne_plots
    cfg:
      _target_: experiments.plotlyy.get_tsne_plots
      deps:
        embeddings_path: ${pipeline.params.paths.enc_embeddings_dump_path}
        routing_weights_path: ${pipeline.params.paths.encoder_routing_weights_dump_path}
      name: "Encoder t-SNE"
      title_prefix: "Encoder Head"

  dec_tsne:
    id: dec_tsne_plots
    cfg:
      _target_: experiments.plotlyy.get_tsne_plots
      deps:
        embeddings_path: ${pipeline.params.paths.dec_embeddings_dump_path}
        routing_weights_path: ${pipeline.params.paths.routing_weights_dump_path}
      name: "Decoder t-SNE"
      title_prefix: "Decoder Head"

  prediction:
    id: prediction_plots
    cfg:
      _target_: experiments.plotlyy.get_prediction_plots
      deps:
        decoder_preds_path: ${pipeline.params.paths.decoder_preds_dump_path}
        encoder_preds_path: ${pipeline.params.paths.encoder_preds_dump_path}
        Y_path: ${pipeline.params.paths.Y_path}
        X_path: ${pipeline.params.paths.X_path}
        test-indexes-path: ${pipeline.params.paths.test_indexes_path}
      test_indexes: ${dataset.test_indexes}

  attention:
    id: attention_plots
    cfg:
      _target_: experiments.plotlyy.get_attention_plots
      deps:
        attw_path: ${pipeline.params.paths.attw_dump_path}
  
  routing_weights:
    id: routing_weights_plots
    cfg:
      _target_: experiments.plotlyy.get_routing_weights_plots
      deps:
        routing_weights_path: ${pipeline.params.paths.routing_weights_dump_path}


framework:
  keras:
    losses:
      mae:
        file_deps: []
        cfg:
          decoder_outputs:
            _target_: keras.losses.MeanAbsoluteError
          encoder_outputs: # null
            _target_: keras.losses.MeanAbsoluteError
      dlma:
        file_deps:
          - \${src}/kerass/losses/DynamicLossMaskAnnealing.py
          - \${src}/kerass/callbacks.py
        cfg:
          encoder_outputs: 
            _target_: keras.losses.MeanAbsoluteError
          decoder_outputs:
            _target_: experiments.kerass.losses.DynamicLossMaskAnnealing
            mode: "batch"
            schedule: "step"
    
    selected_loss: mae

    file_deps:
      train_fn: \${src}/stages/train/kerass.py
      test_fn: \${src}/stages/test/kerass.py
      framework_training_specific: ${framework.keras.losses.${framework.keras.selected_loss}.file_deps}
    params:
      train:
        fn: experiments.stages.train.kerass.train

        compile:
          loss: ${framework.keras.losses.${framework.keras.selected_loss}.cfg}
          metrics: &metrics
            # encoder_outputs: null
            #   - _target_: keras.metrics.MeanAbsoluteError
            decoder_outputs:
              - _target_: keras.metrics.MeanAbsoluteError
                name: "scaled_mae"
              - _target_: keras.metrics.RootMeanSquaredError
                name: "scaled_rmse"
              - _target_: experiments.kerass.metrics.SymmetricMeanAbsolutePercentageError
                name: "scaled_smape"
          run_eagerly: false
          optimizer:
            _target_: tensorflow.keras.optimizers.Adam
            learning_rate: 0.01

        fit:
          batch_size: 64
          epochs: 50
          callbacks:
            # _target_: experiments.utils.dict_values_to_list
            - _target_: keras.callbacks.ModelCheckpoint
              filepath: ${pipeline.params.paths.model_path}
              monitor: val_decoder_outputs_scaled_mae
              save_best_only: true
              save_weights_only: true
              mode: min
              initial_value_threshold: 0.065
              verbose: 1

      test:
        fn: experiments.stages.test.kerass.test
        batch_size: 512
        compile:
          loss:
            encoder_outputs: null
            decoder_outputs:
              _target_: keras.losses.MeanAbsoluteError
          metrics: *metrics

model:

  pooling_layers:
    MMP:
      name: MMP
      file_deps:
        - \${src}/kerass/layers/spatio_temporal/pooling/MultiMomentPooling.py
      cfg:
        _target_: experiments.kerass.layers.spatio_temporal.pooling.MultiMomentPooling
        include_skewness: true
        include_extremes: true
        include_dirichlet_energy: false

  moe_routers:
    default_args:
      n_experts: 8
      top_k: 3
      aux_loss_weight: 0.01
      z_loss_weight: 0.001
    Shazeer:
      name: Shazeer
      file_deps:
        - \${src}/kerass/layers/routers/ShazeerMoeRouter.py
      cfg:
        _target_: experiments.kerass.layers.routers.ShazeerMoeRouter
        n_experts: ${model.moe_routers.default_args.n_experts}
        top_k: ${model.moe_routers.default_args.top_k}
        aux_loss_weight: ${model.moe_routers.default_args.aux_loss_weight}
        z_loss_weight: ${model.moe_routers.default_args.z_loss_weight}
    Switch:
      name: Switch
      file_deps:
        - \${src}/kerass/layers/routers/SwitchMoeRouter.py
      cfg:
        _target_: experiments.kerass.layers.routers.SwitchMoeRouter
        n_experts: ${model.moe_routers.default_args.n_experts}
        top_k: ${model.moe_routers.default_args.top_k}
        aux_loss_weight: ${model.moe_routers.default_args.aux_loss_weight}
        z_loss_weight: ${model.moe_routers.default_args.z_loss_weight}

  gnns:
    GCN:
      name: GCN
      file_deps:
        - \${src}/kerass/layers/gnn/GraphConv.py
      cfg:
        gnn_type: spektral
        activation: null
        use_bias: true
    GAT:
      name: GAT
      file_deps:
        - \${src}/kerass/layers/gnn/GAT.py
      cfg:
        gnn_type: gat
        skipconn: false
        normalize: false
    GCNSKIPCONN:
      name: GCNSKIPCONN
      file_deps:
        - \${src}/kerass/layers/gnn/GCNSKIPCONN.py
      cfg:
        gnn_type: GCNSKIPCONN
        activation: null
        use_bias: true
    # MoE-GCN:
    #   file_deps:
    #     - \${src}/kerass/layers/gnn/MoeGraphConv.py
    #     - \${src}/kerass/layers/routers/MoeRouter.py
    #   cfg:
    #     gnn_type: moe_spektral
    #     activation: null
    #     use_bias: true
    #     num_experts: 8
    #     top_k: 3
    MoE-GNN:
      pooling_layer: MMP
      moe_router: Shazeer
      experts:
        - GCN
        - GAT
        - GCNSKIPCONN
      expert_names: ${concat_lists:${model.gnns.${.experts[0]}.name},${model.gnns.${.experts[1]}.name},${model.gnns.${.experts[2]}.name}}
      prefix: "${model.moe_routers.${.moe_router}.name}-${model.pooling_layers.${.pooling_layer}.name}-GMoE-"
      name: ${get_set_name:${.prefix},${.expert_names},""}
      file_deps: ${concat_lists:${model.gnns.${.experts[0]}.file_deps},${model.gnns.${.experts[1]}.file_deps},${model.gnns.${.experts[2]}.file_deps},"\${src}/kerass/layers/gnn/MoeGNN.py",${model.moe_routers.${.moe_router}.file_deps},${model.pooling_layers.${.pooling_layer}.file_deps}}
      cfg:
        gnn_type: moe_gnn
        experts_configs:
          - ${model.gnns.${...experts[0]}.cfg}
          - ${model.gnns.${...experts[1]}.cfg}
          - ${model.gnns.${...experts[2]}.cfg}
        moe_router: ${model.moe_routers.${..moe_router}.cfg}
        pooling_layer: ${model.pooling_layers.${..pooling_layer}.cfg}