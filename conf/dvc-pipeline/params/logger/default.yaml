version: 1
formatters:
  simple:
    format: '[%(asctime)s][%(levelname)s] %(message)s' # [%(name)s][%(filename)s: %(lineno)d]
handlers:
  console:
    class: logging.StreamHandler
    formatter: simple
    stream: ext://sys.stderr
root:
  level: INFO
  handlers:
  - console
disable_existing_loggers: false