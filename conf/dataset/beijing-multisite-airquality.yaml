
all_scalers:
  gemini:
    file_deps:
      - \${src}/kerass/layers/scaling/MinMaxScaler.py
      - \${src}/kerass/layers/scaling/IdentityScaler.py
      - \${src}/kerass/layers/scaling/StandardScaler.py
      - \${src}/kerass/layers/scaling/Log1pScaler.py
      - \${src}/kerass/layers/scaling/SequentialScaler.py
    cfg:
      - &pollutants_scaler
        _target_: experiments.kerass.layers.scaling.SequentialScaler.from_numpy # PM2.5
        scalers_classes:
          - Log1pScaler
          - StandardScaler
      # - *pollutants_scaler # PM10
      - *pollutants_scaler # SO2
      - *pollutants_scaler # NO2
      - *pollutants_scaler # CO
      - *pollutants_scaler # O3
      - _target_: experiments.kerass.layers.scaling.StandardScaler.from_numpy # TEMP
      - _target_: experiments.kerass.layers.scaling.StandardScaler.from_numpy # PRES
      - _target_: experiments.kerass.layers.scaling.StandardScaler.from_numpy # DEWP
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # WSPM
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # RAIN_ind
      - _target_: experiments.kerass.layers.scaling.StandardScaler.from_numpy # RAIN_int
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # hour_sin
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # hour_cos
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # month_sin
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # month_cos
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # day_sin
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # day_cos
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # wd_sin
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # wd_cos
  minmax:
    file_deps:
      - \${src}/kerass/layers/scaling/MinMaxScaler.py
      - \${src}/kerass/layers/scaling/IdentityScaler.py
    cfg:
      - &minmax_scaler # PM2.5
        _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy
      # - *minmax_scaler # PM10
      - *minmax_scaler # SO2
      - *minmax_scaler # NO2
      - *minmax_scaler # CO
      - *minmax_scaler # O3
      - *minmax_scaler # TEMP
      - *minmax_scaler # PRES
      - *minmax_scaler # DEWP
      - *minmax_scaler # WSPM
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # RAIN_ind
      - *minmax_scaler # RAIN_int
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # hour_sin
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # hour_cos
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # month_sin
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # month_cos
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # day_sin
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # day_cos
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # wd_sin
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # wd_cos

