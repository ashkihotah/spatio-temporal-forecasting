n_nodes: 12
n_features: ${get_n_features:13,${params.dataset.use_time_features}}
name: beijing-multisite-airquality

params:
  meta:
    dataset: beijing-multisite-airquality
    scaler: minmax

  paths:
    bma_dir_path: dvc-stages-outputs/beijing-multisite-airquality/raw
    dataset_path: dvc-stages-outputs/beijing-multisite-airquality/preprocessed.npz

  prepare:
    h: 6
    p: 6
    stride: 6
    
  split:
      seasonal_folds:
        train:
          - [spring, [0, 91]]
          - [summer, [92, 183]]
          - [autumn, [184, 274]]
          - [winter, [275, 364]]

          - [spring, [365, 456]]
          - [summer, [457, 548]]
          - [autumn, [549, 639]]
          - [winter, [640, 729]]

          - [spring, [730, 821]]
          - [summer, [822, 913]]
          - [autumn, [914, 1004]]
          - [winter, [1005, 1095]]
          
        non_train:
          - [spring, [1096, 1187]]
          - [summer, [1188, 1279]]
          - [autumn, [1280, 1370]]
          - [winter, [1371, 1460]]

dvc:
  stages:
    beijing-multisite-airquality:
      cmd: >-
        python -m experiments.stages.preprocess.beijing_multisite_airquality
      deps:
        - \${src}/stages/preprocess/beijing_multisite_airquality.py
        - \${paths.bma_dir_path}
      params:
        - paths.bma_dir_path
        - paths.dataset_path
      outs:
        - \${paths.dataset_path}