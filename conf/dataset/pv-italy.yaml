n_nodes: 17
n_features: ${get_n_features:11,${params.dataset.use_time_features}}
name: pv-italy

params:
  meta:
    dataset: ${dataset.name}

  paths:
    raw_dir_path: dvc-stages-outputs/pv-italy/raw
    dataset_path: dvc-stages-outputs/pv-italy/preprocessed.npz

  prepare:
    h: 19
    p: 19
    stride: 19

  split:
    seasonal_folds:
      # We merge January and February of 2012 with the following spring season 
      # since this winter seasonal fold is too short (only 59 days) 
      # and we want to have 90 days (3 months) for each seasonal fold.
      # WINTER Jan 1, 2012 - Feb 29, 2012 (Leap year)
      train:
        - [winter, [0, 59]]     # Jan 1, 2012 - Feb 29, 2012 (Leap year)
        - [spring, [60, 151]]   # Mar 1, 2012 - May 31, 2012
        - [summer, [152, 243]]  # Jun 1, 2012 - Aug 31, 2012
        - [autumn, [244, 334]]  # Sep 1, 2012 - Nov 30, 2012
        - [winter, [335, 424]]  # Dec 1, 2012 - Feb 28, 2013

      non_train:
        - [spring, [425, 516]]  # Mar 1, 2013 - May 31, 2013
        - [summer, [517, 608]]  # Jun 1, 2013 - Aug 31, 2013
        - [autumn, [609, 699]]  # Sep 1, 2013 - Nov 30, 2013
        - [winter, [700, 789]]  # Dec 1, 2013 - Feb 28, 

        - [spring, [790, 855]]  # Mar 1, 2014 - May 5, 2014  

dvc:
  stages:
    pv-italy:
      cmd: >-
        python -m experiments.stages.preprocess.pv_italy
      deps:
        - \${src}/stages/preprocess/pv_italy.py
        - \${paths.raw_dir_path}
      params:
        - paths.raw_dir_path
        - paths.dataset_path
      outs:
        - \${paths.dataset_path}