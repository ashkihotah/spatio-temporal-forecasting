all_scalers:
  gemini:
    file_deps:
      - \${src}/kerass/layers/scaling/MinMaxScaler.py
      - \${src}/kerass/layers/scaling/IdentityScaler.py

    cfg:
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler # kwh
        min_val: 0.0
        max_val: 1000.0
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # temperature
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # irradiance
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # pressure
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # windspeed
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # humidity
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # dewpoint
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # windbearing
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # cloudcover
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler # altitude
        min_val: -180
        max_val: 180
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler # azimuth
        min_val: -180
        max_val: 180
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # hour_sin
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # hour_cos
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # month_sin
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # month_cos
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # day_sin
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # day_cos

  minmax:
    file_deps:
      - \${src}/kerass/layers/scaling/MinMaxScaler.py
      - \${src}/kerass/layers/scaling/IdentityScaler.py

    cfg:
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # kwh
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # temperature
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # irradiance
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # pressure
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # windspeed
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # humidity
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # dewpoint
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # windbearing
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # cloudcover
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # altitude
      - _target_: experiments.kerass.layers.scaling.MinMaxScaler.from_numpy # azimuth

      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # hour_sin
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # hour_cos
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # month_sin
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # month_cos
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # day_sin
      - _target_: experiments.kerass.layers.scaling.IdentityScaler.from_numpy # day_cos

