# @package _global_

model:

  moe_routers:
    default_args:
      n_experts: 9

  gnns:
    MoE-GNN:
      experts:
        - GCN
        - GAT
        - GCNSKIPCONN
        - GCN
        - GAT
        - GCNSKIPCONN
        - GCN
        - GAT
        - GCNSKIPCONN
    file_deps: ${concat_lists:${model.gnns.${.experts[0]}.file_deps},${model.gnns.${.experts[1]}.file_deps},${model.gnns.${.experts[2]}.file_deps},${model.gnns.${.experts[3]}.file_deps},${model.gnns.${.experts[4]}.file_deps},${model.gnns.${.experts[5]}.file_deps},${model.gnns.${.experts[6]}.file_deps},${model.gnns.${.experts[7]}.file_deps},${model.gnns.${.experts[8]}.file_deps},"\${src}/kerass/layers/gnn/MoeGNN.py","\${src}/kerass/layers/routers/MoeRouter.py"}
    cfg:
      gnn_type: moe_gnn
      experts_configs:
        - ${model.gnns.${.experts[0]}.cfg}
        - ${model.gnns.${.experts[1]}.cfg}
        - ${model.gnns.${.experts[2]}.cfg}
        - ${model.gnns.${.experts[3]}.cfg}
        - ${model.gnns.${.experts[4]}.cfg}
        - ${model.gnns.${.experts[5]}.cfg}
        - ${model.gnns.${.experts[6]}.cfg}
        - ${model.gnns.${.experts[7]}.cfg}
        - ${model.gnns.${.experts[8]}.cfg}